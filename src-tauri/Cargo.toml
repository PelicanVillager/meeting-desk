[package]
name = "meeting-desk"
version = "0.1.0"
description = "会议材料工作台 / Meeting Desk —— 完全本地运行的会议材料管理与阅读工具"
authors = ["Alex"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "meeting_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：随包编译 SQLite（含 FTS5），不依赖系统库，天然离线
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
url = "2"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
